# EQForge system-wide filter — PipeWire config fragment.
#
# Install to:  ~/.config/pipewire/pipewire.conf.d/99-eqforge.conf
# Activate:    systemctl --user restart pipewire pipewire-pulse wireplumber
#
# Requires libeqforge-filter.so in the SPA search path, e.g.:
#   /usr/lib/x86_64-linux-gnu/spa-0.2/eqforge/libeqforge-filter.so
#
# The node reads the resolved dsp-config from `config`; EQForge rewrites that
# file on every profile change and the node hot-reloads it (~1 s).

context.modules = [
    {   name = libpipewire-module-adapter
        args = {
            factory.name     = eqforge.filter
            node.name        = "eqforge_filter"
            node.description = "EQForge Audio Processor"
            media.class      = "Audio/Sink"
            audio.channels   = 2
            audio.position   = [ FL FR ]
            config           = "/home/USER/.config/eqforge/active-dsp.json"
        }
    }
]

# Routing: make eqforge_filter the default sink and link its outputs to your
# physical sink, e.g. with WirePlumber:
#
#   wpctl set-default @DEFAULT_AUDIO_SINK@   # after selecting eqforge_filter
#
# or automatically via the policy snippet in
# packaging/wireplumber/50-eqforge.lua.example
