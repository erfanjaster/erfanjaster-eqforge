[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqforge"
version = "1.0.0"
description = "EQForge - profile-driven smart audio processing for Linux (native C DSP core + PipeWire integration)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "EQForge contributors" }]
keywords = ["audio", "equalizer", "pipewire", "dsp", "linux", "lufs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
eqforge = "eqforge.cli.main:main"

[project.urls]
Homepage = "https://github.com/eqforge/eqforge"

[tool.setuptools.packages.find]
include = ["eqforge*"]

[tool.setuptools.package-data]
eqforge = [
    "profiles/presets/*.json",
    "gui/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
